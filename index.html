<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Космическая шахта — Наследие</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />

  <style>
    :root {
      --bg: #070b15;
      --bg2: #0f172a;
      --card: rgba(15, 23, 42, 0.82);
      --line: rgba(148, 163, 184, 0.18);
      --text: #e5e7eb;
      --muted: #94a3b8;
      --accent: #22d3ee;
      --accent2: #a855f7;
      --good: #34d399;
      --warn: #f59e0b;
      --danger: #fb7185;
      --skin: #22d3ee;
      --skin2: #4c1d95;
      --skin-glow: rgba(34, 211, 238, 0.5);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
      margin: 0;
      min-height: 100%;
      background:
        radial-gradient(circle at top, rgba(34, 211, 238, 0.12), transparent 35%),
        radial-gradient(circle at bottom right, rgba(168, 85, 247, 0.12), transparent 35%),
        linear-gradient(180deg, var(--bg), var(--bg2));
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      overflow-x: hidden;
    }

    button { font: inherit; color: inherit; border: 0; cursor: pointer; }

    #stars {
      position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden;
      background:
        radial-gradient(circle at 18% 22%, rgba(34,211,238,0.10), transparent 40%),
        radial-gradient(circle at 82% 78%, rgba(168,85,247,0.10), transparent 40%);
    }
    #stars i {
      position: absolute; width: 2px; height: 2px; border-radius: 50%;
      background: #fff; opacity: 0.8; animation: twinkle 3s ease-in-out infinite;
    }
    @keyframes twinkle { 0%,100% { opacity: 0.25; } 50% { opacity: 0.95; } }

    #app { position: relative; z-index: 1; width: min(100%, 520px); margin: 0 auto; padding: 14px 14px 28px; }
    header, .mine, .panel { position: relative; z-index: 1; }

    header {
      padding: 12px; border: 1px solid var(--line); border-radius: 22px;
      background: var(--card); backdrop-filter: blur(12px);
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.25);
    }
    h1 { margin: 0; font-size: 24px; line-height: 1.1; letter-spacing: -0.02em; }
    .sub { margin-top: 4px; color: var(--muted); font-size: 13px; }

    .stats { margin-top: 12px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
    .stat { padding: 10px; border-radius: 16px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.06); }
    .stat small { display: block; color: var(--muted); font-size: 11px; margin-bottom: 4px; }
    .stat b { font-size: 16px; word-break: break-word; }

    .mine {
      margin-top: 14px; padding: 14px; border-radius: 24px; border: 1px solid var(--line);
      background: var(--card); backdrop-filter: blur(12px); text-align: center;
    }
    #combo {
      display: inline-block; min-width: 110px; padding: 6px 10px; border-radius: 999px;
      background: rgba(34,211,238,0.12); border: 1px solid rgba(34,211,238,0.2);
      color: var(--accent); font-weight: 800; font-size: 13px;
    }

    .asteroid-wrap { position: relative; margin: 16px auto 8px; width: 220px; height: 220px; display: grid; place-items: center; }

    .asteroid {
      width: 190px; height: 190px; border-radius: 50%;
      background:
        radial-gradient(circle at 32% 28%, rgba(255,255,255,0.55), transparent 22%),
        radial-gradient(circle at 70% 72%, rgba(0,0,0,0.45), transparent 30%),
        radial-gradient(circle at 50% 50%, var(--skin), var(--skin2) 72%, #0b1020 100%);
      box-shadow:
        inset -16px -16px 34px rgba(0,0,0,0.5),
        inset 12px 12px 26px rgba(255,255,255,0.18),
        0 0 0 2px rgba(103,232,249,0.55),
        0 0 38px var(--skin-glow),
        0 20px 60px rgba(0,0,0,0.45);
      transition: transform 120ms ease, box-shadow 200ms ease;
      touch-action: manipulation;
    }
    .asteroid:active { transform: scale(0.96); }
    .asteroid.pulse { animation: pulse 180ms ease; }
    @keyframes pulse { 0% { transform: scale(1); } 40% { transform: scale(0.94); } 100% { transform: scale(1); } }
    .asteroid.crit-flash {
      box-shadow:
        inset -16px -16px 34px rgba(0,0,0,0.5),
        inset 12px 12px 26px rgba(255,255,255,0.3),
        0 0 0 4px #fde047,
        0 0 60px rgba(253,224,71,0.85),
        0 20px 60px rgba(0,0,0,0.45);
    }

    #clickInfo { color: var(--muted); font-size: 13px; margin-top: 4px; }
    #boostStatus { margin-top: 10px; font-size: 13px; color: var(--warn); min-height: 18px; }

    .actions { margin-top: 12px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
    .btn {
      padding: 12px 10px; border-radius: 16px; background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.08); font-weight: 700; font-size: 13px;
      transition: transform 120ms ease, background 120ms ease, opacity 120ms ease;
    }
    .btn:hover { background: rgba(255,255,255,0.09); }
    .btn:active { transform: scale(0.98); }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn.primary { background: linear-gradient(135deg, rgba(34,211,238,0.22), rgba(168,85,247,0.22)); border-color: rgba(34,211,238,0.25); }
    .btn.good { background: rgba(52,211,153,0.14); border-color: rgba(52,211,153,0.22); }
    .btn.danger { background: rgba(251,113,133,0.12); border-color: rgba(251,113,133,0.2); }

    .panel {
      margin-top: 14px; padding: 14px; border-radius: 24px; border: 1px solid var(--line);
      background: var(--card); backdrop-filter: blur(12px);
    }
    .panel h2 { margin: 0 0 10px; font-size: 18px; }
    .panel h3 { margin: 14px 0 8px; font-size: 15px; color: var(--muted); font-weight: 700; }

    .upgrade {
      display: flex; justify-content: space-between; gap: 10px; align-items: center;
      padding: 10px; border-radius: 16px; background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.06); margin-bottom: 8px;
    }
    .upgrade b { display: block; font-size: 14px; }
    .muted { color: var(--muted); font-size: 12px; }
    .buy-btn {
      min-width: 112px; padding: 10px; border-radius: 14px; background: rgba(34,211,238,0.12);
      border: 1px solid rgba(34,211,238,0.18); font-weight: 800; font-size: 12px;
    }
    .buy-btn:disabled { opacity: 0.45; cursor: not-allowed; }
    #synergyText { color: var(--muted); font-size: 13px; line-height: 1.45; }

    .overlay {
      position: fixed; inset: 0; background: rgba(2,6,23,0.72); backdrop-filter: blur(8px);
      display: grid; place-items: center; padding: 16px; z-index: 50;
    }
    .overlay.hidden { display: none; }
    .modal {
      width: min(100%, 460px); max-height: 82vh; overflow: auto; padding: 16px; border-radius: 24px;
      background: linear-gradient(180deg, rgba(15,23,42,0.98), rgba(2,6,23,0.98));
      border: 1px solid var(--line); box-shadow: 0 30px 90px rgba(0,0,0,0.45);
    }
    .modal h2 { margin: 0 0 10px; font-size: 20px; }
    .modal p { margin: 8px 0; color: var(--muted); line-height: 1.45; font-size: 14px; }
    .modal-actions { display: grid; gap: 8px; margin-top: 14px; }
    .list { display: grid; gap: 8px; margin-top: 10px; }
    .list-item {
      padding: 10px; border-radius: 16px; background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.06); display: flex; justify-content: space-between;
      gap: 10px; align-items: center;
    }
    .pill { display: inline-block; padding: 4px 8px; border-radius: 999px; background: rgba(255,255,255,0.06); color: var(--muted); font-size: 11px; font-weight: 700; }

    #toasts { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 80; display: grid; gap: 8px; width: min(92vw, 420px); pointer-events: none; }
    .toast {
      padding: 10px 12px; border-radius: 14px; background: rgba(2,6,23,0.92); border: 1px solid var(--line);
      color: var(--text); font-size: 13px; box-shadow: 0 12px 30px rgba(0,0,0,0.25); animation: toastIn 180ms ease;
    }
    @keyframes toastIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

    #fx { position: fixed; inset: 0; pointer-events: none; z-index: 70; }
    .float {
      position: absolute; transform: translate(-50%, -50%); color: var(--accent); font-weight: 900;
      font-size: 16px; text-shadow: 0 4px 16px rgba(0,0,0,0.45); animation: floatUp 900ms ease forwards; white-space: nowrap;
    }
    .float.crit { color: #fde047; font-size: 20px; }
    @keyframes floatUp {
      0% { opacity: 1; transform: translate(-50%, -50%) scale(0.9); }
      20% { opacity: 1; transform: translate(-50%, -70%) scale(1.05); }
      100% { opacity: 0; transform: translate(-50%, -160%) scale(0.95); }
    }
    .spark {
      position: absolute; width: 6px; height: 6px; border-radius: 50%; pointer-events: none; z-index: 71;
      box-shadow: 0 0 8px currentColor; animation: sparkFly 600ms ease-out forwards;
    }
    @keyframes sparkFly {
      0% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
      100% { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(0.2); opacity: 0; }
    }
    .center { text-align: center; }
    .small { font-size: 12px; }
  </style>
</head>
<body>
  <div id="app">
    <header>
      <h1>Космическая шахта</h1>
      <div class="sub">Небесное тело: <span id="skinName">Рудный астероид</span></div>
      <div class="stats">
        <div class="stat"><small>Кристаллы</small><b id="crystals">0</b></div>
        <div class="stat"><small>В секунду</small><b id="cps">0</b></div>
        <div class="stat"><small>Осколки звёзд</small><b id="shards">0</b></div>
        <div class="stat"><small>Вечный множитель</small><b id="eternal">x1.00</b></div>
      </div>
    </header>

    <section class="mine">
      <div id="combo">COMBO x1.0</div>
      <div class="asteroid-wrap">
        <button id="asteroid" class="asteroid" aria-label="Добыть"></button>
      </div>
      <div id="clickInfo">+1 за клик · Крит: 5% шанс · x10</div>
      <div id="boostStatus">Буст не активен</div>
      <div class="actions">
        <button id="btnBoost" class="btn primary ad-btn">▶ Буст x2 · 30с</button>
        <button id="btnCollect" class="btn primary ad-btn">⚡ Собрать 60с</button>
        <button id="btnDaily" class="btn good">Ежедневная награда</button>
        <button id="btnSkins" class="btn">🛒 Скины</button>
        <button id="btnHeritage" class="btn">⚛ Наследие</button>
        <button id="btnFriends" class="btn">👥 Друзья</button>
        <button id="btnShare" class="btn ad-btn">📣 Позвать друга</button>
        <button id="btnSave" class="btn">Сохранить</button>
        <button id="btnReset" class="btn danger">Сброс</button>
      </div>
    </section>

    <section class="panel">
      <h2>Улучшения</h2>
      <div id="upgrades"></div>
      <h3>Синергия оборудования</h3>
      <div id="synergyText"></div>
    </section>
  </div>

  <div id="overlay" class="overlay hidden">
    <div class="modal">
      <div id="modalBody"></div>
      <div class="modal-actions"><button class="btn" data-action="close">Закрыть</button></div>
    </div>
  </div>

  <div id="toasts"></div>
  <div id="fx"></div>

  <script src="https://unpkg.com/@vkontakte/vk-bridge/dist/vk-bridge.umd.js"></script>
  <script src="platform.js"></script>

  <script>
    const SAVE_KEY = 'spaceMineVkLegacy_v1';
    const PRESTIGE_THRESHOLD = 1_000_000;
    const OFFLINE_CAP_SECONDS = 8 * 60 * 60;
    const INTERSTITIAL_COOLDOWN = 3 * 60 * 1000;
    const SESSION_BEFORE_INTERSTITIAL = 2 * 60 * 1000;

    const SKINS = [
      { id: 0, name: 'Рудный астероид', cost: 0,         color: '#22d3ee', color2: '#4c1d95', glow: 'rgba(34,211,238,0.55)' },
      { id: 1, name: 'Лёд',             cost: 5_000,     color: '#7dd3fc', color2: '#1e3a8a', glow: 'rgba(125,211,252,0.55)' },
      { id: 2, name: 'Обсидиан',        cost: 50_000,    color: '#a78bfa', color2: '#1e1b4b', glow: 'rgba(167,139,250,0.55)' },
      { id: 3, name: 'Плазма',          cost: 250_000,   color: '#f472b6', color2: '#7c3aed', glow: 'rgba(244,114,182,0.55)' },
      { id: 4, name: 'Нейтрон',         cost: 1_000_000, color: '#67e8f9', color2: '#0ea5e9', glow: 'rgba(103,232,249,0.6)'  },
      { id: 5, name: 'Квант',           cost: 5_000_000, color: '#fde047', color2: '#db2777', glow: 'rgba(253,224,71,0.6)'   }
    ];

    const UPGRADES = {
      drill:   { name: 'Бур',   desc: '+1 кристалл/сек',   base: 15,  growth: 1.15 },
      drone:   { name: 'Дрон',  desc: '+5 кристаллов/сек', base: 100, growth: 1.15 },
      pickaxe: { name: 'Кирка', desc: '+1 за клик',        base: 25,  growth: 1.15 }
    };

    const FRIEND_NAMES = ['Орион', 'Вега', 'Сириус', 'Альтаир', 'Денеб', 'Полярис', 'Кассиопея', 'Ригель'];

    const dom = {
      crystals: document.getElementById('crystals'),
      cps: document.getElementById('cps'),
      shards: document.getElementById('shards'),
      eternal: document.getElementById('eternal'),
      skinName: document.getElementById('skinName'),
      combo: document.getElementById('combo'),
      asteroid: document.getElementById('asteroid'),
      clickInfo: document.getElementById('clickInfo'),
      boostStatus: document.getElementById('boostStatus'),
      upgrades: document.getElementById('upgrades'),
      synergyText: document.getElementById('synergyText'),
      overlay: document.getElementById('overlay'),
      modalBody: document.getElementById('modalBody'),
      toasts: document.getElementById('toasts'),
      fx: document.getElementById('fx'),
      btnBoost: document.getElementById('btnBoost'),
      btnCollect: document.getElementById('btnCollect'),
      btnDaily: document.getElementById('btnDaily'),
      btnSkins: document.getElementById('btnSkins'),
      btnHeritage: document.getElementById('btnHeritage'),
      btnFriends: document.getElementById('btnFriends'),
      btnShare: document.getElementById('btnShare'),
      btnSave: document.getElementById('btnSave'),
      btnReset: document.getElementById('btnReset')
    };

    let state = loadState();
    let myId = '';
    let adPending = false;
    let pendingOffline = 0;
    let sessionStart = Date.now();
    let lastInterstitial = 0;
    let lastTick = performance.now();

    function defaultState() {
      return {
        crystals: 0, runCrystals: 0, lifetimeCrystals: 0, shards: 0,
        drill: 0, drone: 0, pickaxe: 0, boostUntil: 0, comboCount: 0, comboExpire: 0,
        skin: 0, ownedSkins: [0], lastSeen: Date.now(), lastDailyDay: -1, dailyStreak: 0,
        inviteClaimed: false, invitedBy: '', friends: [], version: 1
      };
    }

    function loadState() {
      const saved = Platform.storageGet(SAVE_KEY, null);
      const merged = Object.assign(defaultState(), saved || {});
      if (!Array.isArray(merged.ownedSkins) || merged.ownedSkins.length === 0) merged.ownedSkins = [0];
      if (!Array.isArray(merged.friends)) merged.friends = [];
      return merged;
    }

    function saveState() { state.lastSeen = Date.now(); Platform.storageSet(SAVE_KEY, state); }
    function resetState() { state = defaultState(); saveState(); renderUpgrades(); updateUI(); toast('Прогресс сброшен'); }

    function fmt(number) {
      const n = Number(number || 0);
      if (!Number.isFinite(n)) return '0';
      if (n < 1000) return Math.floor(n).toString();
      const units = ['', 'K', 'M', 'B', 'T', 'Qa', 'Qi', 'Sx', 'Sp'];
      const unitIndex = Math.min(Math.floor(Math.log10(Math.abs(n)) / 3), units.length - 1);
      const value = n / Math.pow(1000, unitIndex);
      return value.toFixed(value >= 100 ? 0 : value >= 10 ? 1 : 2) + units[unitIndex];
    }

    function currentSkin() { return SKINS.find(s => s.id === state.skin) || SKINS[0]; }
    function eternalMultiplier() { return 1 + state.shards * 0.02; }
    function boostActive() { return Date.now() < state.boostUntil; }
    function comboMultiplier() { return 1 + Math.min(state.comboCount, 10) * 0.1; }

    function synergy() {
      const drillBonus = state.drill * 0.001;
      const droneBonus = state.drone * 0.0015;
      const pickBonus = state.pickaxe * 0.001;
      return {
        incomeDrill: drillBonus, incomeDrone: droneBonus, tapPick: pickBonus,
        incomeTotal: 1 + drillBonus + droneBonus, tapTotal: 1 + pickBonus + drillBonus * 0.5
      };
    }

    function getCps() {
      const base = state.drill * 1 + state.drone * 5;
      const syn = synergy();
      const boost = boostActive() ? 2 : 1;
      return base * syn.incomeTotal * eternalMultiplier() * boost;
    }

    function getClickValue() {
      const base = 1 + state.pickaxe;
      const syn = synergy();
      const boost = boostActive() ? 2 : 1;
      return base * syn.tapTotal * eternalMultiplier() * comboMultiplier() * boost;
    }

    function getCost(type) {
      const item = UPGRADES[type];
      const count = state[type] || 0;
      return Math.floor(item.base * Math.pow(item.growth, count));
    }

    function addCrystals(amount, countAsProgress = true) {
      const value = Number(amount || 0);
      if (!Number.isFinite(value) || value <= 0) return;
      state.crystals += value;
      if (countAsProgress) { state.runCrystals += value; state.lifetimeCrystals += value; }
    }

    function toast(message) {
      const el = document.createElement('div');
      el.className = 'toast'; el.textContent = message; dom.toasts.appendChild(el);
      setTimeout(() => el.remove(), 2500);
    }

    function spawnFloat(text, x, y, isCrit = false) {
      const el = document.createElement('div');
      el.className = 'float' + (isCrit ? ' crit' : ''); el.textContent = text;
      el.style.left = `${x}px`; el.style.top = `${y}px`; dom.fx.appendChild(el);
      setTimeout(() => el.remove(), 900);
    }

    function buildStars() {
      const wrap = document.createElement('div');
      wrap.id = 'stars';
      document.body.insertBefore(wrap, document.body.firstChild);
      for (let i = 0; i < 60; i++) {
        const s = document.createElement('i');
        s.style.left = Math.random() * 100 + 'vw';
        s.style.top = Math.random() * 100 + 'vh';
        s.style.animationDelay = (Math.random() * 3) + 's';
        s.style.transform = 'scale(' + (0.6 + Math.random() * 1.4) + ')';
        wrap.appendChild(s);
      }
    }

    function spawnSparks(x, y, color, big) {
      const n = big ? 12 : 7;
      for (let i = 0; i < n; i++) {
        const el = document.createElement('div');
        el.className = 'spark';
        const ang = Math.random() * Math.PI * 2;
        const dist = (big ? 70 : 45) + Math.random() * 40;
        el.style.left = x + 'px'; el.style.top = y + 'px';
        el.style.color = color; el.style.background = color;
        el.style.setProperty('--dx', Math.cos(ang) * dist + 'px');
        el.style.setProperty('--dy', Math.sin(ang) * dist + 'px');
        dom.fx.appendChild(el);
        setTimeout(() => el.remove(), 600);
      }
    }

    function openModal(html) { dom.modalBody.innerHTML = html; dom.overlay.classList.remove('hidden'); }
    function closeModal() { dom.overlay.classList.add('hidden'); dom.modalBody.innerHTML = ''; }
    function isModalOpen() { return !dom.overlay.classList.contains('hidden'); }
    function setAdButtons(disabled) { document.querySelectorAll('.ad-btn').forEach(btn => { btn.disabled = Boolean(disabled); }); }

    async function withRewarded(successMessage, rewardFunction) {
      if (adPending) return;
      adPending = true; setAdButtons(true);
      const success = await Platform.showRewardedAd();
      adPending = false; setAdButtons(false);
      if (success) { rewardFunction(); toast(successMessage); saveState(); updateUI(); }
      else { toast('Реклама недоступна. Открой игру внутри VK.'); }
    }

    async function maybeInterstitial(force = false) {
      if (!Platform.vk || adPending || isModalOpen()) return;
      const now = Date.now();
      const sessionOk = now - sessionStart > SESSION_BEFORE_INTERSTITIAL;
      const cooldownOk = now - lastInterstitial > INTERSTITIAL_COOLDOWN;
      if (!force && (!sessionOk || !cooldownOk)) return;
      if (force && now - lastInterstitial < 60_000) return;
      lastInterstitial = now;
      await Platform.showInterstitialAd();
    }

    function renderUpgrades() {
      dom.upgrades.innerHTML = Object.entries(UPGRADES).map(([key, item]) => {
        const count = state[key] || 0;
        const cost = getCost(key);
        const disabled = state.crystals < cost ? 'disabled' : '';
        return `
          <div class="upgrade">
            <div>
              <b>${item.name} <span class="muted">${count}</span></b>
              <div class="muted">${item.desc}</div>
            </div>
            <button class="buy-btn" data-buy="${key}" ${disabled}>Купить ${fmt(cost)}</button>
          </div>`;
      }).join('');
    }

    function refreshUpgradeButtons() {
      document.querySelectorAll('[data-buy]').forEach(btn => {
        const key = btn.dataset.buy;
        const cost = getCost(key);
        btn.textContent = `Купить ${fmt(cost)}`;
        btn.disabled = state.crystals < cost;
      });
    }

    function updateUI() {
      dom.crystals.textContent = fmt(state.crystals);
      dom.cps.textContent = fmt(getCps());
      dom.shards.textContent = fmt(state.shards);
      dom.eternal.textContent = `x${eternalMultiplier().toFixed(2)}`;

      const skin = currentSkin();
      dom.skinName.textContent = skin.name;
      document.documentElement.style.setProperty('--skin', skin.color);
      document.documentElement.style.setProperty('--skin2', skin.color2 || skin.color);
      document.documentElement.style.setProperty('--skin-glow', skin.glow || 'rgba(34,211,238,0.5)');

      dom.combo.textContent = `COMBO x${comboMultiplier().toFixed(1)}`;
      const clickValue = getClickValue();
      dom.clickInfo.textContent = `+${fmt(clickValue)} за клик · Крит: 5% шанс · x10`;

      if (boostActive()) {
        const left = Math.max(0, Math.ceil((state.boostUntil - Date.now()) / 1000));
        dom.boostStatus.textContent = `Буст x2 активен: ${left} сек`;
      } else {
        dom.boostStatus.textContent = 'Буст не активен';
      }

      const syn = synergy();
      dom.synergyText.innerHTML = `
        Буры → доход +${(syn.incomeDrill * 100).toFixed(1)}%<br>
        Дроны → доход +${(syn.incomeDrone * 100).toFixed(1)}%<br>
        Кирки → тап +${(syn.tapPick * 100).toFixed(1)}%`;

      refreshUpgradeButtons();
    }

    function buyUpgrade(type) {
      const cost = getCost(type);
      if (state.crystals < cost) { toast('Недостаточно кристаллов'); return; }
      state.crystals -= cost;
      state[type] = (state[type] || 0) + 1;
      saveState(); renderUpgrades(); updateUI();
    }

    function mineClick(event) {
      const now = Date.now();
      if (now - state.comboExpire < 1500) { state.comboCount = Math.min(state.comboCount + 1, 10); }
      else { state.comboCount = 1; }
      state.comboExpire = now + 1500;

      let value = getClickValue();
      const isCrit = Math.random() < 0.05;
      if (isCrit) value *= 10;
      addCrystals(value);

      const x = event.clientX || window.innerWidth / 2;
      const y = event.clientY || window.innerHeight / 2;
      spawnFloat(`${isCrit ? 'КРИТ ' : '+'}${fmt(value)}`, x, y, isCrit);
      spawnSparks(x, y, isCrit ? '#fde047' : (currentSkin().color || '#22d3ee'), isCrit);
      if (isCrit) {
        dom.asteroid.classList.add('crit-flash');
        setTimeout(() => dom.asteroid.classList.remove('crit-flash'), 220);
      }

      dom.asteroid.classList.remove('pulse');
      void dom.asteroid.offsetWidth;
      dom.asteroid.classList.add('pulse');
      updateUI();
    }

    function activateBoost() { state.boostUntil = Date.now() + 30_000; }
    function collectForSeconds(seconds) { const gain = getCps() * seconds; addCrystals(gain); return gain; }
    function todayIndex() { return Math.floor(Date.now() / 86_400_000); }
    function canClaimDaily() { return state.lastDailyDay !== todayIndex(); }
    function dailyRewardBase(nextStreak = state.dailyStreak + 1) { return Math.floor(100 * Math.max(1, nextStreak) * eternalMultiplier()); }

    function claimDaily(multiplier = 1) {
      if (!canClaimDaily()) { toast('Ежедневная награда уже получена сегодня'); return; }
      const prevDay = todayIndex() - 1;
      state.dailyStreak = state.lastDailyDay === prevDay ? state.dailyStreak + 1 : 1;
      state.lastDailyDay = todayIndex();
      const reward = Math.floor(dailyRewardBase(state.dailyStreak) * multiplier);
      addCrystals(reward);
      saveState(); updateUI(); closeModal();
      toast(`Ежедневная награда: +${fmt(reward)}`);
      setTimeout(() => maybeInterstitial(false), 5000);
    }

    function openDailyModal() {
      if (!canClaimDaily()) {
        openModal(`<h2>Ежедневная награда</h2><p>Ты уже забрал награду сегодня. Возвращайся завтра.</p><p class="muted">Серия: ${state.dailyStreak} дней</p>`);
        return;
      }
      const reward = dailyRewardBase(state.dailyStreak + 1);
      openModal(`
        <h2>Ежедневная награда</h2>
        <p>День ${Math.min(state.dailyStreak + 1, 7)} из 7</p>
        <p><b>Награда:</b> ${fmt(reward)} кристаллов</p>
        <div class="modal-actions">
          <button class="btn good" data-action="dailyClaim">Забрать</button>
          <button class="btn primary ad-btn" data-action="dailyDouble">Забрать x2 за рекламу</button>
        </div>`);
    }

    function openOfflineModal() {
      if (pendingOffline <= 0) return;
      openModal(`
        <h2>С возвращением, командир</h2>
        <p>Пока ты отсутствовал, оборудование добыло:</p>
        <p><b>${fmt(pendingOffline)}</b> кристаллов</p>
        <div class="modal-actions">
          <button class="btn good" data-action="offlineTake">Забрать</button>
          <button class="btn primary ad-btn" data-action="offlineDouble">Удвоить за рекламу</button>
        </div>`);
    }

    function checkOffline() {
      const now = Date.now();
      const elapsed = Math.min((now - state.lastSeen) / 1000, OFFLINE_CAP_SECONDS);
      if (elapsed < 10) return;
      const gain = getCps() * elapsed * 0.5;
      if (gain < 1) return;
      pendingOffline = gain;
      openOfflineModal();
    }

    function openSkinsModal() {
      const items = SKINS.map(skin => {
        const owned = state.ownedSkins.includes(skin.id);
        const equipped = state.skin === skin.id;
        let action = '';
        if (equipped) action = '<span class="pill">Надет</span>';
        else if (owned) action = `<button class="btn good" data-action="skinEquip" data-id="${skin.id}">Надеть</button>`;
        else { const disabled = state.crystals < skin.cost ? 'disabled' : ''; action = `<button class="btn primary" data-action="skinBuy" data-id="${skin.id}" ${disabled}>Купить ${fmt(skin.cost)}</button>`; }
        return `
          <div class="list-item">
            <div><b>${skin.name}</b><div class="muted">${owned ? 'Открыт' : `Цена: ${fmt(skin.cost)}`}</div></div>
            <div>${action}</div>
          </div>`;
      }).join('');
      openModal(`
        <h2>Гараж скинов</h2>
        <p>Скины открываются за кристаллы или рекламную крутку.</p>
        <div class="modal-actions"><button class="btn primary ad-btn" data-action="skinSpin">▶ Крутка скина за рекламу</button></div>
        <div class="list">${items}</div>`);
    }

    function equipSkin(id) { if (!state.ownedSkins.includes(id)) return; state.skin = id; saveState(); updateUI(); openSkinsModal(); }
    function buySkin(id) {
      const skin = SKINS.find(s => s.id === id);
      if (!skin || state.ownedSkins.includes(id)) return;
      if (state.crystals < skin.cost) { toast('Недостаточно кристаллов'); return; }
      state.crystals -= skin.cost; state.ownedSkins.push(id); state.skin = id;
      saveState(); updateUI(); openSkinsModal(); toast(`Скин открыт: ${skin.name}`);
    }
    function spinSkin() {
      withRewarded('Крутка завершена', () => {
        const unowned = SKINS.filter(s => !state.ownedSkins.includes(s.id));
        if (unowned.length > 0) {
          const pick = unowned[Math.floor(Math.random() * unowned.length)];
          state.ownedSkins.push(pick.id); state.skin = pick.id; toast(`Новый скин: ${pick.name}`);
        } else {
          const bonus = Math.floor(25_000 * eternalMultiplier());
          addCrystals(bonus); toast(`Все скины открыты. Бонус: +${fmt(bonus)}`);
        }
        saveState(); updateUI(); openSkinsModal();
      });
    }

    function prestigeGain() { if (state.runCrystals < PRESTIGE_THRESHOLD) return 0; return Math.floor(Math.sqrt(state.runCrystals / PRESTIGE_THRESHOLD)); }
    function getNextHeritageObject() {
      if (state.shards >= 100) return 'Квазар';
      if (state.shards >= 50) return 'Нейтронная звезда';
      if (state.shards >= 20) return 'Газовый гигант';
      if (state.shards >= 5) return 'Астероид';
      return 'Рудный астероид';
    }
    function openHeritageModal() {
      const gain = prestigeGain(); const can = gain > 0; const nextObject = getNextHeritageObject();
      openModal(`
        <h2>Наследие</h2>
        <p>Пересобери корабль. Прогресс улучшения сбросится, но ты получишь вечные Осколки звёзд.</p>
        <p><b>Осколки сейчас:</b> ${fmt(state.shards)}</p>
        <p><b>Вечный множитель:</b> x${eternalMultiplier().toFixed(2)}</p>
        <p><b>Получишь при сбросе:</b> +${fmt(gain)}</p>
        <p><b>Следующий объект:</b> ${nextObject}</p>
        <div class="modal-actions"><button class="btn primary" data-action="prestige" ${can ? '' : 'disabled'}>Пересобрать корабль</button></div>`);
    }
    function doPrestige() {
      const gain = prestigeGain();
      if (gain <= 0) { toast('Нужно больше кристаллов за этот забег'); return; }
      state.shards += gain; state.crystals = 0; state.runCrystals = 0;
      state.drill = 0; state.drone = 0; state.pickaxe = 0; state.boostUntil = 0; state.comboCount = 0;
      saveState(); renderUpgrades(); updateUI(); closeModal();
      toast(`Наследие укреплено: +${fmt(gain)} осколков`);
      setTimeout(() => maybeInterstitial(true), 4000);
    }

    function ensureFriends() {
      if (state.friends.length > 0) return;
      state.friends = FRIEND_NAMES.slice(0, 5).map((name, index) => ({
        id: `npc_${index}`, name,
        crystals: Math.floor(1000 * (index + 1) * (1 + state.shards * 0.2)),
        lastHelp: 0, lastSteal: 0
      }));
      saveState();
    }
    function formatCooldown(ms) {
      const totalMinutes = Math.ceil(ms / 60000);
      if (totalMinutes >= 60) { const hours = Math.floor(totalMinutes / 60); const minutes = totalMinutes % 60; return `${hours}ч ${minutes}м`; }
      return `${totalMinutes} мин`;
    }
    function openFriendsModal() {
      ensureFriends();
      const now = Date.now();
      const items = state.friends.map(friend => {
        const helpLeft = Math.max(0, 4 * 60 * 60 * 1000 - (now - friend.lastHelp));
        const stealLeft = Math.max(0, 8 * 60 * 60 * 1000 - (now - friend.lastSteal));
        const helpDisabled = helpLeft > 0 ? 'disabled' : '';
        const stealDisabled = stealLeft > 0 ? 'disabled' : '';
        return `
          <div class="list-item">
            <div>
              <b>${friend.name}</b>
              <div class="muted">Ресурсы: ${fmt(friend.crystals)}</div>
              ${helpLeft > 0 ? `<div class="muted small">Помощь через ${formatCooldown(helpLeft)}</div>` : ''}
              ${stealLeft > 0 ? `<div class="muted small">Кража через ${formatCooldown(stealLeft)}</div>` : ''}
            </div>
            <div style="display:grid;gap:6px;">
              <button class="btn good" data-action="friendHelp" data-id="${friend.id}" ${helpDisabled}>Помочь</button>
              <button class="btn danger" data-action="friendSteal" data-id="${friend.id}" ${stealDisabled}>Украсть</button>
            </div>
          </div>`;
      }).join('');
      openModal(`
        <h2>Социальный модуль</h2>
        <p>Помогай соседям по галактике, кради ресурсы и зови новых игроков.</p>
        <div class="modal-actions"><button class="btn primary ad-btn" data-action="shareInvite">📣 Поделиться / позвать друга</button></div>
        <div class="list">${items}</div>`);
    }
    function helpFriend(id) {
      const friend = state.friends.find(f => f.id === id); if (!friend) return;
      const now = Date.now();
      if (now - friend.lastHelp < 4 * 60 * 60 * 1000) { toast('Помощь недоступна, подожди'); return; }
      friend.lastHelp = now;
      const bonus = Math.floor(friend.crystals * 0.02 + 100 * eternalMultiplier());
      addCrystals(bonus); friend.crystals = Math.max(0, friend.crystals - Math.floor(bonus * 0.5));
      saveState(); updateUI(); openFriendsModal(); toast(`Помощь принята: +${fmt(bonus)}`);
    }
    function stealFriend(id) {
      const friend = state.friends.find(f => f.id === id); if (!friend) return;
      const now = Date.now();
      if (now - friend.lastSteal < 8 * 60 * 60 * 1000) { toast('Кража недоступна, подожди'); return; }
      friend.lastSteal = now;
      const amount = Math.floor(friend.crystals * 0.05);
      friend.crystals = Math.max(0, friend.crystals - amount); addCrystals(amount);
      saveState(); updateUI(); openFriendsModal(); toast(`Украдено: +${fmt(amount)}`);
    }

    async function shareInvite() {
      const baseUrl = `${location.origin}${location.pathname}`;
      const link = `${baseUrl}?ref=${encodeURIComponent(myId)}`;
      const result = await Platform.share(link, 'Космическая шахта — Наследие', 'Залетай в космическую шахту: кликай, прокачивай дронов и уходи в наследие.');
      if (result === 'copied') toast('Ссылка скопирована');
      else if (result === 'failed') toast('Не удалось поделиться');
    }

    function setupPlayerId() {
      const storedId = Platform.storageGet('spaceMinePlayerId', '');
      if (storedId) { myId = storedId; return; }
      const randomId = `p_${Date.now().toString(36)}_${Math.random().toString(36).slice(2, 8)}`;
      myId = randomId; Platform.storageSet('spaceMinePlayerId', myId);
    }
    async function setupVKUser() {
      const user = await Platform.getUser();
      if (user && user.id) { myId = `vk_${user.id}`; Platform.storageSet('spaceMinePlayerId', myId); }
    }
    function handleReferral() {
      const ref = Platform.getParam('ref');
      if (!ref || ref === myId || state.inviteClaimed) return;
      state.inviteClaimed = true; state.invitedBy = ref;
      const bonus = Math.floor(1000 * eternalMultiplier());
      addCrystals(bonus); saveState(); updateUI(); toast(`Бонус по приглашению: +${fmt(bonus)}`);
    }

    function bindEvents() {
      dom.asteroid.addEventListener('pointerdown', mineClick);
      dom.btnBoost.addEventListener('click', () => withRewarded('Буст x2 на 30 секунд активирован', activateBoost));
      dom.btnCollect.addEventListener('click', () => withRewarded('Мгновенный сбор за 60 секунд получен', () => { const gain = collectForSeconds(60); toast(`Собрано: +${fmt(gain)}`); }));
      dom.btnDaily.addEventListener('click', openDailyModal);
      dom.btnSkins.addEventListener('click', openSkinsModal);
      dom.btnHeritage.addEventListener('click', openHeritageModal);
      dom.btnFriends.addEventListener('click', openFriendsModal);
      dom.btnShare.addEventListener('click', shareInvite);
      dom.btnSave.addEventListener('click', () => { saveState(); toast('Игра сохранена'); });
      dom.btnReset.addEventListener('click', () => openModal(`
        <h2>Сброс</h2>
        <p>Точно сбросить весь прогресс? Это действие нельзя отменить.</p>
        <div class="modal-actions">
          <button class="btn danger" data-action="confirmReset">Да, сбросить</button>
          <button class="btn" data-action="close">Отмена</button>
        </div>`));
      dom.upgrades.addEventListener('click', event => { const btn = event.target.closest('[data-buy]'); if (!btn) return; buyUpgrade(btn.dataset.buy); });
      dom.modalBody.addEventListener('click', event => {
        const btn = event.target.closest('[data-action]'); if (!btn) return;
        const action = btn.dataset.action;
        const id = btn.dataset.id ? Number(btn.dataset.id) : null;
        switch (action) {
          case 'close': closeModal(); break;
          case 'confirmReset': resetState(); closeModal(); break;
          case 'offlineTake': addCrystals(pendingOffline); pendingOffline = 0; saveState(); updateUI(); closeModal(); toast('Оффлайн-доход собран'); break;
          case 'offlineDouble': withRewarded('Оффлайн-доход удвоен', () => { addCrystals(pendingOffline * 2); pendingOffline = 0; saveState(); updateUI(); closeModal(); }); break;
          case 'dailyClaim': claimDaily(1); break;
          case 'dailyDouble': withRewarded('Ежедневная награда удвоена', () => claimDaily(2)); break;
          case 'skinEquip': equipSkin(id); break;
          case 'skinBuy': buySkin(id); break;
          case 'skinSpin': spinSkin(); break;
          case 'prestige': doPrestige(); break;
          case 'friendHelp': helpFriend(btn.dataset.id); break;
          case 'friendSteal': stealFriend(btn.dataset.id); break;
          case 'shareInvite': shareInvite(); break;
        }
      });
      dom.overlay.addEventListener('click', event => { if (event.target === dom.overlay) closeModal(); });
      document.addEventListener('visibilitychange', () => { if (document.hidden) saveState(); });
      window.addEventListener('beforeunload', saveState);
    }

    function tick() {
      const now = performance.now();
      const dt = Math.max(0, (now - lastTick) / 1000);
      lastTick = now;
      addCrystals(getCps() * dt);
      if (Date.now() > state.comboExpire) state.comboCount = 0;
      updateUI();
    }

    async function boot() {
      await Platform.init();
      buildStars();
      setupPlayerId();
      await setupVKUser();
      handleReferral();
      bindEvents();
      renderUpgrades();
      updateUI();
      checkOffline();
      setInterval(tick, 100);
      setInterval(saveState, 10_000);
    }

    boot();
  </script>
</body>
</html>
